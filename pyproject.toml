[project]
name = "mcrataway"
dynamic = ["version"]
description = "Minecraft mod malware scanner"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.13.0",
    "websockets>=17.0",
    "click>=8.5.0",
    "rich>=15.0.0",
    "PyYAML>=6.0.3",
    "cryptography>=50.0.0",
    "regex>=2026.9.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "types-PyYAML>=6.0.12",
    "types-regex>=2026.9.10",
    "build>=1.6.0",
]

[project.scripts]
mcrataway = "mcrataway.__main__:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "mcrataway.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcrataway = [
    "server/static/**/*",
    "rules/packs/*.yaml",
    "rules/packs/*.yaml.sig",
    "reputation/*.yaml",
    "reputation/*.yaml.sig",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Coverage gate is enforced in CI (.github/workflows/ci.yml) via
# `pytest --cov=mcrataway --cov-fail-under=78`, not here — local
# `pytest` stays fast and quiet. The floor is ratcheted: raise it
# when coverage improves, never lower it.
