name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run mypy Type Checker
        run: |
          mypy src/

      - name: Run pytest Suite
        run: |
          pytest

  web:
    name: Web Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: web
        run: npm ci

      - name: Type Check
        working-directory: web
        run: npx tsc -b

      - name: Run Vitest Suite
        working-directory: web
        run: npx vitest run

      - name: Build
        # Also serves as a check that src/mcrataway/server/static/ (the
        # build.yml release workflow's input) can actually be
        # reproduced from web/src/ — catches the two silently drifting
        # apart again, which is what happened for months before this
        # job existed.
        working-directory: web
        run: npm run build
