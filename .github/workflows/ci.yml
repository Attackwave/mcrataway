name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Read-only unless a job asks for more.
permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff Linter
        run: |
          ruff check src/ tests/

      - name: Run mypy Type Checker
        run: |
          mypy src/

      - name: Run pytest Suite with coverage gate
        run: |
          pytest --cov=mcrataway --cov-fail-under=78 --cov-report=term-missing

  supply-chain:
    name: Supply Chain (pip-audit + SBOM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit cyclonedx-bom

      - name: Run pip-audit (dependency vulnerability scan)
        run: |
          # Audit installed dependencies for known vulnerabilities.
          # A security scanner that itself ships vulnerable deps is
          # the worst-case narrative — this gates the CI on a clean
          # dependency tree.
          # --skip-editable: skip the local editable install of
          #   mcrataway itself (not on PyPI, can't be audited — only
          #   its dependencies, the actual supply-chain surface,
          #   are checked).
          # pip-audit exits non-zero by default when vulnerabilities
          # are found; --strict was removed because it also fails on
          # the editable-install notice (harmless, not a vulnerability).
          pip-audit --skip-editable

      - name: Generate CycloneDX SBOM
        run: |
          # Generate a Software Bill of Materials for the installed
          # package — this is what users and security teams use to
          # track what's in the scanner they're running.
          cyclonedx-py environment -o sbom.json --sv 1.5

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
