name: Build Standalone Binaries

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'scripts/build.py'
      - 'mcrataway.spec'
      - 'pyproject.toml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'scripts/build.py'
      - 'mcrataway.spec'
      - 'pyproject.toml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Run Build Script
        run: |
          python scripts/build.py

      - name: Determine Binary Artifact Name
        id: artifact_name
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "SRC_PATH=dist_win/mcrataway.exe" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=mcrataway-windows-amd64.exe" >> $GITHUB_ENV
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            echo "SRC_PATH=dist/mcrataway" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=mcrataway-macos-universal" >> $GITHUB_ENV
          else
            echo "SRC_PATH=dist/mcrataway" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=mcrataway-linux-x86_64" >> $GITHUB_ENV
          fi

      - name: Rename Binary to Unique Artifact Name
        shell: bash
        run: cp "${{ env.SRC_PATH }}" "${{ env.ARTIFACT_NAME }}"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write  # needed for cosign OIDC keyless signing

    steps:
      - name: Download All Binary Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS checksums
        working-directory: release-assets
        run: |
          sha256sum * > ../SHA256SUMS
          cp ../SHA256SUMS .

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        run: |
          # Keyless signing via GitHub OIDC — no private key to manage.
          # Users verify with `cosign verify-blob SHA256SUMS
          # --certificate-identity-regexp "https://github.com/Attackwave/mcrataway"
          # --certificate-oidc-issuer "https://token.actions.githubusercontent.com"`
          cosign sign-blob --yes SHA256SUMS --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
            SHA256SUMS
            SHA256SUMS.sig
            SHA256SUMS.pem
          generate_release_notes: true
