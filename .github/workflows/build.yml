name: Build Standalone Binaries

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'scripts/build.py'
      - 'mcrataway.spec'
      - 'pyproject.toml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'scripts/build.py'
      - 'mcrataway.spec'
      - 'pyproject.toml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Run Build Script
        run: |
          python scripts/build.py

      - name: Determine Binary Artifact Name
        id: artifact_name
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "SRC_PATH=dist_win/mcrataway.exe" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=mcrataway-windows-amd64.exe" >> $GITHUB_ENV
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            echo "SRC_PATH=dist/mcrataway" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=mcrataway-macos-universal" >> $GITHUB_ENV
          else
            echo "SRC_PATH=dist/mcrataway" >> $GITHUB_ENV
            echo "ARTIFACT_NAME=mcrataway-linux-x86_64" >> $GITHUB_ENV
          fi

      - name: Rename Binary to Unique Artifact Name
        shell: bash
        run: cp "${{ env.SRC_PATH }}" "${{ env.ARTIFACT_NAME }}"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write  # needed for cosign OIDC keyless signing

    steps:
      - name: Download All Binary Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS checksums
        working-directory: release-assets
        run: |
          sha256sum * > ../SHA256SUMS
          cp ../SHA256SUMS .

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign SHA256SUMS with cosign (keyless OIDC)
        run: |
          # Keyless signing via GitHub OIDC — no private key to manage.
          # Users verify with `cosign verify-blob SHA256SUMS
          # --certificate-identity-regexp "https://github.com/Attackwave/mcrataway"
          # --certificate-oidc-issuer "https://token.actions.githubusercontent.com"`
          cosign sign-blob --yes SHA256SUMS --output-signature SHA256SUMS.sig --output-certificate SHA256SUMS.pem

      - name: Publish Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-assets/*
            SHA256SUMS
            SHA256SUMS.sig
            SHA256SUMS.pem
          generate_release_notes: true
